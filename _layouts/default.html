<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><nav><a href="{{ '/' | relative_url }}#guides">All guides</a></nav></div></header>
<main class="wrap">{{ content }}</main>
<footer><div class="wrap">
<p>As an Amazon Associate we earn from qualifying purchases. "See options" links may earn us a commission at no extra cost to you.</p>
<p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
</div></footer>
<script>
(function(){var els=document.querySelectorAll('.card,.pick,article h2');
if(!('IntersectionObserver' in window))return;
els.forEach(function(e,i){e.classList.add('reveal');e.style.setProperty('--i',i%4)});
var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{rootMargin:'0px 0px -8% 0px'});
els.forEach(function(e){io.observe(e)});})();
</script>
</body>
</html>
